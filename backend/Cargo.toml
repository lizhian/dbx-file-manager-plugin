[package]
name = "dbx-plugin-dbx-file-manager-plugin"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"

[workspace]

[dependencies]
dbx-plugin-sdk = { git = "https://github.com/t8y2/dbx.git", rev = "c26ff3f6d4bd643be8dedd659c3236af4a5bd556" }
base64 = "0.22"
futures = "0.3"
percent-encoding = "2"
roxmltree = "0.21"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "io-util", "macros"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
opendal = { version = "=0.57.0", default-features = false, features = ["executors-tokio", "reqwest-rustls-tls", "services-ftp", "services-s3", "services-webdav", "services-webhdfs", "services-hdfs-native"] }

[target.'cfg(unix)'.dependencies]
opendal = { version = "=0.57.0", default-features = false, features = ["services-sftp"] }

[dev-dependencies]
opendal = { version = "=0.57.0", default-features = false, features = ["services-memory"] }
