name: Validate plugin metadata

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run validate
      - run: npm test
      - run: npm run test:mock-host
      - run: npm run build
      - run: bash -n docs/tests/setup.sh
      - run: docker compose -f docs/tests/compose.yaml config --quiet
