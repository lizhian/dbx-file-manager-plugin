name: Release DBX plugin
on:
  release:
    types: [published]
permissions:
  contents: write
env:
  PLUGIN_CLI_VERSION: '0.1.3'
  AWS_LC_SYS_PREBUILT_NASM: '1'
  PYTHONUTF8: '1'
jobs:
  validate:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        env: { RELEASE_TAG: ${{ github.event.release.tag_name }} }
        run: |
          npm ci --no-audit --no-fund
          npm run validate
          test "$RELEASE_TAG" = "v$(node -p \"require('./manifest.json').version\")"
  build:
    if: startsWith(github.event.release.tag_name, 'v')
    needs: validate
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: linux-x64 }
          - { runner: ubuntu-24.04-arm, target: linux-arm64 }
          - { runner: macos-15, target: darwin-arm64 }
          - { runner: macos-15-intel, target: darwin-x64 }
          - { runner: windows-2022, target: windows-x64 }
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libssl-dev nasm unzip
      - name: Windows toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - run: cargo build --locked --release --manifest-path backend/Cargo.toml
        env: { CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: lld-link.exe }
      - run: npm install --global "@dbx-app/plugin-cli@${PLUGIN_CLI_VERSION}" --no-audit --no-fund
      - name: Package candidate
        env:
          DBX_PLUGIN_TARGET: ${{ matrix.target }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/backend/target
          NO_COLOR: '1'
        run: dbx-plugin package .
      - uses: actions/upload-artifact@v4
        with:
          name: dbx-plugin-${{ matrix.target }}
          path: dist/*.dbxp
          if-no-files-found: error
  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: dbx-plugin-*, path: dist, merge-multiple: true }
      - name: Upload release assets
        env: { GH_TOKEN: ${{ github.token }}, RELEASE_TAG: ${{ github.event.release.tag_name }} }
        run: gh release upload "$RELEASE_TAG" dist/*.dbxp --repo "$GITHUB_REPOSITORY" --clobber
