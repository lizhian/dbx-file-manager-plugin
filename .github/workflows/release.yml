name: Build macOS ARM plugin
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: cargo test --locked --manifest-path backend/Cargo.toml
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64-unsigned
          path: |
            dist/*.dbxp
            dist/*.artifact.json
          if-no-files-found: error
